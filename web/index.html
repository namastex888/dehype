<!doctype html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Trend Observatory</title>

<meta name="description" content="Open AI research observatory: papers, GitHub repos and sampled attention, scored with public methods. Unknown stays unknown.">
<meta property="og:type" content="website">
<meta property="og:title" content="Trend Observatory: which AI papers and repos are moving, and is the attention backed by evidence?">
<meta property="og:description" content="Open, daily-refreshed rankings of AI papers, GitHub repos and hyped projects. Public sources, published method, unknown stays unknown. Ask it in plain English.">
<meta property="og:image" content="https://namastex888.github.io/trending-research/og.png">

<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
 --bg:#05080d;--surface-1:#0a0e14;--surface-2:#0f151e;--surface-3:#151d29;--line:#1c2633;--line-2:#263343;
 --text-primary:#e6edf5;--text-secondary:#9aa8b8;--text-muted:#5f6e80;
 --accent:#3fd0ff;--accent-dim:#3fd0ff22;--accent-2:#7c8cff;
 --series-1:#3987e5;--series-2:#d95926;--series-3:#199e70;--series-4:#c98500;--series-5:#d55181;--series-6:#9085e9;
 --good:#0ca30c;--warning:#fab219;--serious:#ec835a;--critical:#d03b3b;
 --grid:#ffffff0d;--glow:0 0 0 1px #3fd0ff33,0 0 24px #3fd0ff14;
 --mono:'JetBrains Mono',ui-monospace,SFMono-Regular,Menlo,monospace;--sans:Inter,system-ui,-apple-system,Segoe UI,sans-serif;
 color-scheme:dark}
:root[data-theme="light"]{
 --bg:#eef2f6;--surface-1:#fcfcfb;--surface-2:#f4f6f8;--surface-3:#e9edf2;--line:#dde3ea;--line-2:#cbd4de;
 --text-primary:#0b0f14;--text-secondary:#46525f;--text-muted:#7a8592;
 --accent:#0a7fb0;--accent-dim:#0a7fb01a;--accent-2:#4a5bd6;
 --series-1:#2a78d6;--series-2:#eb6834;--series-3:#1baf7a;--series-4:#eda100;--series-5:#e87ba4;--series-6:#6250d6;
 --grid:#0000000d;--glow:0 0 0 1px #0a7fb033;color-scheme:light}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--text-primary);font:14px/1.5 var(--sans);-webkit-font-smoothing:antialiased}
body{background-image:radial-gradient(1200px 500px at 80% -10%,#3fd0ff10,transparent 60%),radial-gradient(900px 400px at -10% 10%,#7c8cff0c,transparent 60%),linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);background-size:auto,auto,32px 32px,32px 32px;min-height:100vh}
a{color:var(--accent);text-decoration:none}a:hover{text-decoration:underline}
.mono,.n,.kpi b,.chip,.seg button,code{font-family:var(--mono)}
.dim{color:var(--text-muted)}.sec{color:var(--text-secondary)}
.wrap{max-width:1440px;margin:0 auto;padding:0 20px}
.wrap>*,.panel,.kpi,.chart{min-width:0}
/* top bar */
header.top{position:sticky;top:0;z-index:30;background:color-mix(in srgb,var(--bg) 82%,transparent);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.bar{display:flex;align-items:center;gap:18px;height:56px}
.logo{display:flex;align-items:center;gap:10px;font:600 13px/1 var(--mono);letter-spacing:.14em;white-space:nowrap}
.logo .mk{width:22px;height:22px;border:1.5px solid var(--accent);border-radius:6px;display:grid;place-items:center;box-shadow:var(--glow)}
.logo .mk i{width:8px;height:8px;background:var(--accent);border-radius:2px;animation:pulse 2.4s ease-in-out infinite}
@keyframes pulse{50%{opacity:.35}}
@media (prefers-reduced-motion:reduce){.logo .mk i{animation:none}}
nav.tabs{display:flex;gap:2px;margin-left:8px}
nav.tabs button{background:none;border:0;color:var(--text-secondary);font:500 13px var(--sans);padding:8px 12px;border-radius:8px;cursor:pointer;position:relative}
nav.tabs button:hover{color:var(--text-primary);background:var(--surface-2)}
nav.tabs button.on{color:var(--text-primary)}
nav.tabs button.on::after{content:"";position:absolute;left:12px;right:12px;bottom:-11px;height:2px;background:var(--accent);box-shadow:0 0 12px var(--accent)}
.status{margin-left:auto;display:flex;align-items:center;gap:14px;font:12px var(--mono);color:var(--text-secondary);white-space:nowrap}
.status .led{display:inline-block;width:7px;height:7px;border-radius:50%;margin-right:6px;vertical-align:1px}
.iconbtn{background:var(--surface-2);border:1px solid var(--line);color:var(--text-secondary);border-radius:8px;height:30px;padding:0 10px;cursor:pointer;font:12px var(--mono)}
.iconbtn:hover{color:var(--text-primary);border-color:var(--line-2)}
/* hero / search */
.hero{padding:28px 0 8px}
.hero h1{margin:0 0 4px;font:600 22px/1.25 var(--sans);letter-spacing:-.01em}
.hero p{margin:0;color:var(--text-secondary);max-width:860px}
.ask{margin-top:18px;position:relative}
.ask input{width:100%;height:52px;border-radius:12px;border:1px solid var(--line-2);background:var(--surface-1);color:var(--text-primary);font:15px var(--sans);padding:0 190px 0 46px;outline:none;transition:border-color .15s,box-shadow .15s}
.ask input:focus{border-color:var(--accent);box-shadow:var(--glow)}
.ask .ic{position:absolute;left:16px;top:16px;width:20px;height:20px;color:var(--accent)}
.ask .sem{position:absolute;right:58px;top:11px;height:30px;border-radius:8px;border:1px solid var(--line-2);background:var(--surface-2);color:var(--text-secondary);font:12px var(--mono);padding:0 10px;cursor:pointer}
.ask .sem.on{color:var(--accent);border-color:#3fd0ff66;background:var(--accent-dim);box-shadow:var(--glow)}
.ask kbd{position:absolute;right:14px;top:15px;font:11px var(--mono);color:var(--text-muted);border:1px solid var(--line-2);border-radius:6px;padding:3px 7px}
.parsed{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px;min-height:24px;align-items:center;font-size:12px}
.parsed .lbl{color:var(--text-muted);font:11px var(--mono);letter-spacing:.06em;text-transform:uppercase;margin-right:2px}
.pchip{font:12px var(--mono);background:var(--accent-dim);color:var(--accent);border:1px solid #3fd0ff40;border-radius:999px;padding:2px 9px}
.pchip.t{background:var(--surface-2);color:var(--text-primary);border-color:var(--line-2)}
.examples{display:inline-flex;flex-wrap:wrap;gap:6px}.examples button{background:none;border:1px dashed var(--line-2);color:var(--text-secondary);border-radius:999px;padding:2px 10px;font:12px var(--mono);cursor:pointer}
.examples button:hover{color:var(--accent);border-color:var(--accent)}
/* controls */
.controls{display:flex;flex-wrap:wrap;gap:10px 18px;align-items:center;padding:14px 0 6px}
.seg{display:inline-flex;background:var(--surface-1);border:1px solid var(--line);border-radius:10px;padding:3px;gap:2px;flex-wrap:wrap}
.seg button{background:none;border:0;color:var(--text-secondary);font-size:12px;padding:5px 10px;border-radius:7px;cursor:pointer}
.seg button:hover:not(:disabled){color:var(--text-primary);background:var(--surface-3)}
.seg button.on{background:var(--surface-3);color:var(--text-primary);box-shadow:inset 0 0 0 1px var(--line-2)}
.seg button:disabled{opacity:.35;cursor:not-allowed}
.seg button small{color:var(--text-muted);margin-left:4px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{display:inline-flex;align-items:center;gap:6px;background:var(--surface-1);border:1px solid var(--line);color:var(--text-secondary);font-size:12px;padding:4px 10px;border-radius:999px;cursor:pointer}
.chip:hover{color:var(--text-primary);border-color:var(--line-2)}
.chip.on{color:var(--text-primary);border-color:var(--accent);background:var(--accent-dim)}
.chip .sw{width:8px;height:8px;border-radius:2px}
.facet{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--text-secondary)}
.facet select{background:var(--surface-1);color:var(--text-primary);border:1px solid var(--line);border-radius:8px;font:12px var(--mono);padding:4px 6px}
.ctl-l{font:11px var(--mono);letter-spacing:.08em;text-transform:uppercase;color:var(--text-muted)}
/* notice */
.notice{display:flex;gap:10px;align-items:flex-start;border:1px solid var(--line);background:var(--surface-1);border-left:2px solid var(--warning);border-radius:10px;padding:9px 12px;font-size:12.5px;color:var(--text-secondary);margin:6px 0 0}
.notice b{color:var(--text-primary);font-weight:600}
/* panels */
.kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;margin:16px 0 12px}
.panel{background:linear-gradient(180deg,var(--surface-1),color-mix(in srgb,var(--surface-1) 70%,var(--bg)));border:1px solid var(--line);border-radius:14px;position:relative}
.panel::before{content:"";position:absolute;inset:-1px;border-radius:14px;padding:1px;background:linear-gradient(135deg,#3fd0ff30,transparent 30%,transparent 70%,#7c8cff20);-webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);-webkit-mask-composite:xor;mask-composite:exclude;pointer-events:none}
.kpi{padding:14px 16px}
.kpi .k{font:11px var(--mono);letter-spacing:.08em;text-transform:uppercase;color:var(--text-muted)}
.kpi b{display:block;font-size:26px;font-weight:500;margin-top:4px;letter-spacing:-.02em}
.kpi .s{font-size:12px;color:var(--text-secondary)}
.charts{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.35fr) minmax(0,1fr);gap:12px;margin-bottom:12px}
.chart{padding:14px 16px 10px;min-width:0}
.chart h3,.tablehead h3{margin:0;font:600 13px var(--sans)}
.chart .sub{font-size:12px;color:var(--text-muted);margin:2px 0 8px}
.chart svg{display:block;width:100%;height:auto;overflow:visible}
.chart svg text{font:11px var(--mono);fill:var(--text-secondary)}
.chart svg .ax{stroke:var(--line-2)}.chart svg .gl{stroke:var(--grid);stroke:var(--line)}
.chart svg .hit{fill:transparent;cursor:pointer}
.chart svg .pt{transition:r .1s}
.legend{display:flex;gap:12px;flex-wrap:wrap;font-size:11px;color:var(--text-secondary);margin-top:6px}
.legend i{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:5px;vertical-align:-1px}
/* table */
.tablecard{overflow:hidden;margin-bottom:24px}
.tablehead{display:flex;align-items:center;gap:12px;padding:12px 16px;border-bottom:1px solid var(--line);flex-wrap:wrap}
.tablehead .cnt{font-size:12px;color:var(--text-secondary)}
.tscroll{overflow:auto;max-height:78vh}
table.t{width:100%;border-collapse:separate;border-spacing:0;font-size:13px}
table.t th{position:sticky;top:0;background:var(--surface-2);z-index:2;text-align:left;font:500 11px var(--mono);letter-spacing:.06em;text-transform:uppercase;color:var(--text-muted);padding:9px 10px;border-bottom:1px solid var(--line);white-space:nowrap;user-select:none}
table.t th.s{cursor:pointer}table.t th.s:hover{color:var(--text-primary)}
table.t th.on{color:var(--accent)}
table.t td{padding:9px 10px;border-bottom:1px solid var(--line);vertical-align:top}
table.t tbody tr{cursor:pointer;transition:background .1s}
table.t tbody tr:hover td{background:var(--surface-2)}
table.t tbody tr.sel td{background:var(--accent-dim)}
table.t td.n,table.t th.n{text-align:right;white-space:nowrap}
.ttl{font-weight:500;color:var(--text-primary)}
.ttl a{color:var(--text-primary)}.ttl a:hover{color:var(--accent)}
.desc{color:var(--text-muted);font-size:12px;margin-top:2px;max-width:560px;overflow:hidden;text-overflow:ellipsis;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.rk{font:12px var(--mono);color:var(--text-muted);display:flex;gap:6px;justify-content:flex-end;align-items:center}
.up{color:#3ccf7a}.dn{color:#ff7a7a}.eq{color:var(--text-muted)}
.new{font:10px var(--mono);color:var(--accent);border:1px solid #3fd0ff55;border-radius:4px;padding:0 4px;letter-spacing:.04em}
.rs{color:var(--text-muted)}
.score{font:600 14px var(--mono);color:var(--text-primary)}
.px{color:var(--warning);margin-left:2px;font-weight:400}
.cov{display:inline-flex;align-items:center;gap:6px;color:var(--text-secondary);font:12px var(--mono)}
.cov .bar{width:44px;height:4px;background:var(--surface-3);border-radius:2px;overflow:hidden}
.cov .bar i{display:block;height:100%;background:var(--accent);border-radius:2px}
.tag{display:inline-flex;align-items:center;gap:5px;font:11px var(--mono);color:var(--text-secondary);white-space:nowrap}
.tag i{width:7px;height:7px;border-radius:2px}
.fl{display:inline-block;font:10px var(--mono);color:var(--serious);border:1px solid #ec835a55;border-radius:4px;padding:0 4px;margin:2px 4px 0 0}
.fav{color:var(--warning)}
.gap{font:12px var(--mono);padding:1px 6px;border-radius:5px;border:1px solid var(--line-2)}
.gap.g-attention_ahead{color:#ffb08a;border-color:#d9592666}.gap.g-evidence_ahead{color:#8fc1ff;border-color:#3987e566}.gap.g-similar{color:var(--text-secondary)}.gap.g-insufficient{color:var(--text-muted);border-style:dashed}
.ad{font:10px var(--mono);color:var(--warning);border:1px solid #fab21955;border-radius:4px;padding:0 4px;margin-left:6px}
/* drawer */
.drawer{position:fixed;top:0;right:0;height:100vh;width:min(560px,100vw);background:var(--surface-1);border-left:1px solid var(--line-2);z-index:50;transform:translateX(100%);transition:transform .22s ease;overflow:auto}
.drawer.on{transform:none;box-shadow:-20px 0 60px #0008}
.drawer .dh{position:sticky;top:0;background:var(--surface-1);padding:16px 20px;border-bottom:1px solid var(--line);display:flex;gap:12px;align-items:flex-start;z-index:2}
.drawer .dh h2{margin:0;font:600 17px/1.3 var(--sans);flex:1}
.drawer .db{padding:16px 20px 40px;font-size:13px}
.drawer h4{font:500 11px var(--mono);letter-spacing:.08em;text-transform:uppercase;color:var(--text-muted);margin:20px 0 8px}
.drawer ul{margin:0;padding-left:18px}.drawer li{margin:3px 0}
.drawer table{width:100%;border-collapse:collapse;font-size:12px}
.drawer table td,.drawer table th{padding:5px 6px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
.drawer table th{color:var(--text-muted);font:500 11px var(--mono)}
.kv{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.kv div{background:var(--surface-2);border:1px solid var(--line);border-radius:10px;padding:8px 10px}
.kv span{display:block;font:10px var(--mono);letter-spacing:.06em;text-transform:uppercase;color:var(--text-muted)}
.kv b{font:500 16px var(--mono)}
.scrim{position:fixed;inset:0;background:#0006;z-index:40;opacity:0;pointer-events:none;transition:opacity .2s}
.scrim.on{opacity:1;pointer-events:auto}
/* popover + tooltip */
.pop{position:absolute;right:20px;top:58px;width:min(520px,calc(100vw - 32px));background:var(--surface-1);border:1px solid var(--line-2);border-radius:12px;padding:14px 16px;z-index:60;display:none;box-shadow:0 20px 50px #0009;font-size:12.5px}
.pop.on{display:block}
.pop li{margin:5px 0;list-style:none}.pop ul{padding:0;margin:0}
.st{display:inline-flex;align-items:center;gap:5px;font:11px var(--mono);padding:0 6px;border-radius:4px;border:1px solid}
.st.ok{color:var(--good);border-color:#0ca30c66}.st.warn{color:var(--warning);border-color:#fab21966}.st.bad{color:var(--critical);border-color:#d03b3b66}
#tip{position:fixed;pointer-events:none;z-index:80;background:var(--surface-3);border:1px solid var(--line-2);color:var(--text-primary);border-radius:8px;padding:7px 9px;font:12px/1.4 var(--sans);max-width:300px;opacity:0;transition:opacity .08s;box-shadow:0 8px 24px #0008}
#tip .m{font-family:var(--mono);color:var(--text-secondary)}
/* methodology */
#md{display:none;grid-template-columns:240px minmax(0,1fr);gap:28px;padding:20px 0 60px}
#md nav{position:sticky;top:76px;align-self:start;max-height:calc(100vh - 96px);overflow:auto;font-size:12.5px;border-left:1px solid var(--line);padding-left:12px}
#md nav a{display:block;color:var(--text-secondary);padding:3px 0}#md nav a:hover{color:var(--accent)}
#md article{max-width:860px;font-size:14.5px;line-height:1.7}
#md article h1,#md article h2,#md article h3{font-family:var(--sans);letter-spacing:-.01em;scroll-margin-top:80px}
#md article h2{border-top:1px solid var(--line);padding-top:22px;margin-top:34px}
#md article code{background:var(--surface-2);border:1px solid var(--line);border-radius:4px;padding:0 4px;font-size:12.5px}
#md article pre code{background:none;border:0;padding:0;font-size:12.5px}
#md article pre{background:var(--surface-1);border:1px solid var(--line);border-radius:10px;padding:12px;overflow:auto}
#md article table{border-collapse:collapse;font-size:13px;display:block;overflow:auto}
#md article td,#md article th{border:1px solid var(--line);padding:6px 8px;vertical-align:top}
#md article blockquote{border-left:2px solid var(--accent);margin:0;padding-left:14px;color:var(--text-secondary)}
#md .hl{background:var(--accent-dim);border-radius:6px}
#pulse .pctl{display:flex;flex-wrap:wrap;gap:10px 18px;align-items:center;margin:2px 0 12px}
.pgrid{display:grid;grid-template-columns:minmax(0,1fr) 340px;gap:12px;margin-bottom:24px}
.pmap{align-self:start;padding:0;overflow:hidden;min-height:440px;background:radial-gradient(120% 90% at 50% 42%,#0d1a2c 0%,#070b12 62%,#05080d 100%);border-color:#1c2633}
.pmap::before{background:linear-gradient(135deg,#3fd0ff40,transparent 30%,transparent 70%,#7c8cff30)}
.pmap svg{display:block;width:100%}
.plab.pin{font-weight:600;stroke-width:4px}
.plab{font:11px var(--mono);fill:#eef4fb;paint-order:stroke;stroke:#05080d;stroke-opacity:.92;stroke-width:4px;stroke-linejoin:round;pointer-events:none}
.plinks line{stroke:#7f93ad}
.pstars circle{fill:#cfe3ff}.pstars .tw{animation:ptw 3.6s ease-in-out infinite alternate}
@keyframes ptw{from{opacity:.08}to{opacity:.85}}
.porbit circle{fill:none;stroke:#3fd0ff;stroke-opacity:.1;stroke-dasharray:2 7}
.plegend{display:flex;flex-wrap:wrap;gap:4px 16px;font-size:11px;color:#8a9aae;padding:8px 12px;border-top:1px solid #1c2633}
.plegend b{color:#c6d2e0;font-weight:600}.plegend .em{color:#3fd0ff}
.ramp{display:inline-flex;align-items:center;gap:2px;margin-left:4px;vertical-align:middle}.ramp i{display:inline-block;width:16px;height:9px;border-radius:2px}.ramp small{font:10px var(--mono);margin:0 5px 0 2px;color:#8a9aae}
.prise{color:var(--accent)}
.pring{animation:pring 2.4s ease-out infinite;transform-box:fill-box;transform-origin:center}
@keyframes pring{0%{stroke-opacity:.7;transform:scale(.9)}100%{stroke-opacity:0;transform:scale(1.5)}}
@media (prefers-reduced-motion:reduce){.pstars .tw,.pring{animation:none}}
.kg{font-style:normal;color:var(--accent);font-size:11px}.kg.em{opacity:.9}
.pside{display:grid;gap:12px;align-content:start}
.plist{padding:14px 16px}.plist h3{margin:0;font:600 13px var(--sans)}.plist .sub{font-size:12px;color:var(--text-muted);margin:2px 0 8px}
.prow{display:flex;justify-content:space-between;gap:8px;width:100%;background:none;border:0;border-bottom:1px solid var(--line);color:var(--text-primary);font:13px var(--sans);padding:7px 0;cursor:pointer;text-align:left}
.prow:hover span{color:var(--accent)}.prow b{font:12px var(--mono);color:var(--text-secondary)}
.prow.pm{display:grid;grid-template-columns:minmax(0,1fr) auto;row-gap:2px}.prow.pm small{grid-column:1/-1;font:11px var(--mono);color:var(--text-muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ptable{align-self:start;overflow:hidden}.ptable .tablehead{padding:12px 16px}table.pt td{vertical-align:middle}table.pt th{white-space:nowrap}.ppl{display:inline-block;max-width:190px;font-size:12px;line-height:1.35}table.pt td,table.pt th{padding-left:8px;padding-right:8px}table.pt td .ttl{font-weight:500}
.nbars{display:inline-flex;gap:1px;vertical-align:middle;margin-right:6px}.nbars i{display:block;height:8px;background:var(--series-1);border-radius:1px}.nbars+small{font:11px var(--mono);color:var(--text-muted);white-space:nowrap}

<script>
'use strict';
// ------------------------------------------------------------------ state
let D=null,H=null,M=null;
const S={sem:true,tab:'pulse',win:'7d',view:'all',q:'',mincov:0,onlyNew:false,noFlag:false,sort:null,sel:null,msec:''};
const WN=['1d','7d','30d','90d','180d','1y','overall'];
const REPO='https://github.com/namastex888/trending-research/blob/dev/';
const $=id=>document.getElementById(id);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const DASH='<span class=dim>—</span>';
const num=v=>v==null?DASH:Number(v).toLocaleString('en-US');
const nv=num;
const safe=u=>/^https?:\/\//i.test(u||'')?esc(u):'';
const A=(u,t)=>safe(u)?`<a href="${safe(u)}" target=_blank rel=noopener>${t}</a>`:t;
const srcs=l=>(l||[]).filter(safe).map((u,i)=>`<a href="${safe(u)}" target=_blank rel=noopener title="${esc(u)}">[${i+1}]</a>`).join(' ');
const day=s=>s?String(s).slice(0,10):null;
const pct=c=>c==null?null:Math.round(100*c);
const median=a=>{a=a.filter(x=>x!=null).sort((x,y)=>x-y);if(!a.length)return null;const m=a.length>>1;return a.length%2?a[m]:(a[m-1]+a[m])/2};
const TAGS=['JEPA','JEV','world/action models','harness/context','agents','other'];
const TAGC={'JEPA':'var(--series-1)','JEV':'var(--series-2)','world/action models':'var(--series-3)','harness/context':'var(--series-4)','agents':'var(--series-5)','other':'var(--series-6)'};
const tagc=t=>TAGC[t]||'var(--text-muted)';
const tag=t=>t?`<span class=tag><i style="background:${tagc(t)}"></i>${esc(t)}</span>`:DASH;

// ------------------------------------------------------------------ honesty vocabulary (ported unchanged)
const KIND={'rate-proxy':'rate proxy: per-day-since-release average (no earlier snapshot), counts as half evidence','since-release':'rate since release (younger than the momentum horizon)','measured':'real delta from snapshots / stargazer timestamps','blended':'real snapshot delta blended with the since-release rate (our history is shorter than the window)'};
const FLAG={'stars>activity':'star growth capped: not matched by issue/PR/commit activity','solo':'stars but ≤1 contributor (no outside contributors)','spike':'one-off spike: star rate not sustained across 7/30/90d','single-post':'HN attention is a single post','few-votes':'fewer than 10 upvotes: small sample, counts as part of a signal','single-platform':'all sampled attention on one platform','few-voices':'only a few unique authors in the sample'};
const GSRC={'snapshots':'measured between two of our own snapshots','born-in-window':'repository created inside the window: all its stars count as gained since creation','stargazers':'from GitHub stargazer timestamps','stars/age':'rate proxy: total stars divided by age (no earlier observation)'};
const GABBR={'born-in-window':'new','stargazers':'ts','stars/age':'~'};
const UNQ='verification: unqualified · freshness: unknown · source independence: unqualified';
function flags(f){return (f||[]).map(x=>`<span class=fl title="${esc(FLAG[x]||x)}">${esc(x)}</span>`).join('')}
function mv(r){const m=r.mv;
 if(!m){if(r.prev==null)return '<span class=new>NEW</span>';const d=r.prev-r.rank;return d>0?`<span class=up>▲${d}</span>`:d<0?`<span class=dn>▼${-d}</span>`:'<span class=eq>=</span>'}
 const t=m.why?` title="${esc(m.why)}"`:'';
 return m.s=='up'?`<span class=up>▲${m.d}</span>`:m.s=='down'?`<span class=dn>▼${m.d}</span>`:m.s=='same'?`<span class=eq title="within hysteresis (rank or score change too small)">=</span>`:
  m.s=='reset'?`<span class=rs${t}>·</span>`:`<span class=new${t}>NEW</span>`}
const mvDelta=r=>{const m=r.mv;if(m){return m.s=='up'?m.d:m.s=='down'?-m.d:m.s=='same'?0:null}return r.prev==null?null:r.prev-r.rank};
const isNew=r=>r.mv?r.mv.s=='new':r.prev==null;
function scoreTitle(r,prior){return `score ${r.score}${r.pct!=null?` · percentile ${r.pct}`:''}${r.raw!=null?` · raw ${r.raw} before shrinkage`:''}${r.coverage!=null?` · evidence coverage ${pct(r.coverage)}%`:''}${prior!=null?` · prior ${prior}`:''}${r.kind?` · momentum: ${r.kind}`:''} · ${UNQ}`}
function sc(v,r,prior){if(v==null)return '<span class=dim title="no signal present">—</span>';
 return `<span class=score title="${esc(scoreTitle({...r,score:v},prior))}">${v}</span>${r&&r.kind=='rate-proxy'?`<span class=px title="${esc(KIND['rate-proxy'])}">~</span>`:''}`}
function cov(c){if(c==null)return DASH;const p=pct(c);return `<span class=cov title="evidence coverage ${p}%: weighted signal completeness, not truth probability; verification, freshness and independence are separate"><span class=bar><i style="width:${p}%"></i></span>${p}%</span>`}
function ago(iso){if(!iso)return DASH;const d=(Date.now()-Date.parse(iso))/864e5;return d<1?Math.round(d*24)+'h':Math.round(d)+'d'}
function since(iso){if(!iso)return null;return Math.max(0,Math.floor((Date.now()-Date.parse(iso))/864e5))}

// ------------------------------------------------------------------ smart search: question -> filters (local, deterministic, no model)
const SYN={'jepa':'JEPA','jev':'JEV','world model':'world/action models','world models':'world/action models','world-model':'world/action models','action model':'world/action models','robot':'world/action models','robotics':'world/action models','vla':'world/action models',
 'harness':'harness/context','harnesses':'harness/context','context':'harness/context','memory':'harness/context','mcp':'harness/context','agent':'agents','agents':'agents','agentic':'agents'};
const WINW={'today':'1d','24h':'1d','day':'1d','this week':'7d','week':'7d','weekly':'7d','this month':'30d','month':'30d','quarter':'90d','this year':'1y','year':'1y','all time':'overall','ever':'overall'};
const FIELDS={star:'stars',stars:'stars',score:'score',coverage:'coverage',cov:'coverage',upvote:'upvotes',upvotes:'upvotes',votes:'upvotes',hf:'upvotes',gained:'gained',gain:'gained',contributors:'contributors',commits:'commits',mentions:'mentions',days:'days',age:'days',attention:'attention',discovery:'discovery',gap:'gap'};
const STOP=new Set('a an the of on in for with and or to me show find list papers paper repos repo github hype projects project about that are is top best new rising trending recent latest from by over under more less than at least most fewest sort what which'.split(' '));
function nval(n,u,f){n=parseFloat(n);u=(u||'').toLowerCase();n=u=='k'?n*1e3:u=='m'?n*1e6:u=='%'?n/100:n;if(f=='coverage'&&n>1)n/=100;return n}
function parseQuery(raw,opt={}){
 const P={raw,label:null,tab:null,win:null,tag:null,nums:[],who:null,terms:[],isNew:false,rising:false,sort:null};
 let s=' '+raw.toLowerCase().replace(/[“”"]/g,' ')+' ';
 const take=(re,fn)=>{s=s.replace(re,(...m)=>{fn(...m);return ' '})};
 take(/\b(attention|hype)\s+(?:runs?\s+)?ahead\b/g,()=>{P.label='attention_ahead';P.tab='hype'});take(/\b(discovery|evidence)\s+ahead\b/g,()=>{P.label='evidence_ahead';P.tab='hype'});take(/\b(insufficient|low coverage)\b/g,()=>P.label='insufficient');
 take(/\b(1d|7d|30d|90d|180d|1y|overall)\b/g,(m,w)=>P.win=w);
 for(const k of Object.keys(WINW).sort((a,b)=>b.length-a.length))take(new RegExp('\\b(?:this |last |past )?'+k.replace(/ /g,'\\s+')+'\\b','g'),()=>P.win=WINW[k]);
 take(/\b(?:last|past)\s+(\d+)\s+days?\b/g,(m,n)=>{n=+n;P.win=n<=1?'1d':n<=7?'7d':n<=30?'30d':n<=90?'90d':n<=180?'180d':'1y'});
 const F='(stars?|score|coverage|cov|upvotes?|votes|hf|gained|gain|contributors|commits|mentions|days|age|attention|discovery|gap)';
 const OP={'>':'>','>=':'>=','<':'<','<=':'<=','=':'=',over:'>',above:'>','more than':'>','at least':'>=',under:'<',below:'<','less than':'<','fewer than':'<','at most':'<='};
 take(new RegExp('\\b'+F+'\\s*(>=|<=|>|<|=)\\s*(\\d+(?:\\.\\d+)?)\\s*(k|m|%)?','g'),(m,f,o,n,u)=>P.nums.push({f:FIELDS[f],op:o,v:nval(n,u,FIELDS[f])}));
 take(new RegExp('(>=|<=|>|<|over|above|more than|at least|under|below|less than|fewer than|at most)\\s*(\\d+(?:\\.\\d+)?)\\s*(k|m|%)?\\s*'+F+'\\b','g'),(m,o,n,u,f)=>P.nums.push({f:FIELDS[f],op:OP[o],v:nval(n,u,FIELDS[f])}));
 take(/\b(papers?|arxiv)\b/g,()=>P.tab='papers');take(/\b(repos?|github|repositor(?:y|ies)|code)\b/g,()=>P.tab=P.tab||'repos');take(/\b(hype|attention|buzz)\b/g,()=>P.tab='hype');
 take(/\b(most|top)\s+(starred|stars|upvoted|gained|contributors|commits)\b/g,(m,a,b)=>P.sort={stars:'stars',starred:'stars',upvoted:'upvotes',gained:'gained',contributors:'contributors',commits:'commits'}[b]);
 take(/\b(?:from|by)\s+([a-z0-9][\w.\-@]*(?:\s+(?!with\b|in\b|over\b|under\b|and\b|this\b|last\b|more\b|less\b)[a-z0-9][\w.\-]*){0,2})/g,(m,w)=>{w=w.trim();
  // only a known lab/owner/author becomes a filter; otherwise the words stay as search text
  while(w&&!opt.noWho&&!knownWho(w))w=w.split(' ').slice(0,-1).join(' ');if(w&&!opt.noWho)P.who=w;else P._back=(P._back||'')+' '+m.replace(/^\s*(from|by)\s+/,'')+' '});
 take(/\b(new|newly|fresh|just appeared)\b/g,()=>P.isNew=true);
 take(/\b(rising|risers|climbing|movers|gainers)\b/g,()=>P.rising=true);
 for(const k of Object.keys(SYN).sort((a,b)=>b.length-a.length))take(new RegExp('\\b'+k.replace(/[-/]/g,'\\$&').replace(/ /g,'\\s+')+'\\b','g'),()=>P.tag=P.tag||SYN[k]);
 if(P.nums.some(n=>['gap','discovery','attention'].includes(n.f)))P.tab='hype';
 if(P._back)s+=P._back;
 P.terms=s.split(/[^a-z0-9.+#\-_/]+/).filter(w=>w&&w.length>1&&!STOP.has(w));
 return P}
let WHO_TEXT='',AUTH_TEXT='';
function buildWho(){const a=[],au=[];for(const t of ['papers','repos'])for(const [id,it] of Object.entries(D[t].items)){if(it.lab)a.push(it.lab);if(it.owner)a.push(it.owner);if(it.authors)au.push(...it.authors);if(t=='repos')a.push(id.split('/')[0])}
 WHO_TEXT=' · '+a.join(' · ').toLowerCase()+' · ';AUTH_TEXT=' · '+au.join(' · ').toLowerCase()+' · '}
// labs/owners match on a word; people only on a full name (two or more words), so "from human videos" is not an author filter
function knownWho(w){if(!WHO_TEXT)return true;const re=new RegExp('(^|[^a-z0-9])'+w.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')+'($|[^a-z0-9])');return re.test(WHO_TEXT)||(/\s/.test(w)&&re.test(AUTH_TEXT))}
function lev1(a,b){if(Math.abs(a.length-b.length)>1)return false;let i=0,j=0,e=0;while(i<a.length&&j<b.length){if(a[i]==b[j]){i++;j++;continue}if(++e>1)return false;if(a.length>b.length)i++;else if(b.length>a.length)j++;else{i++;j++}}return e+(a.length-i)+(b.length-j)<=1}
const HAY=new Map();
function hay(r){const k=S.tab+'|'+r.id;let h=HAY.get(k);if(h)return h;
 const t=[r.id,r.title,r.name,r.desc,r.owner,r.lab,(r.authors||[]).join(' '),r.tag,r.category,r.summary,r.paper_title].filter(Boolean).join(' ').toLowerCase();
 h={t,w:t.split(/[^a-z0-9.+#\-_]+/).filter(x=>x.length>3)};HAY.set(k,h);return h}
function termHit(r,term){const h=hay(r);if(h.t.includes(term))return 2;if(term.length>=5&&h.w.some(w=>lev1(w,term)||(w.length>term.length&&lev1(w.slice(0,term.length),term))))return 1;return 0}
function getF(r,f){if(f=='discovery')return r._disc;if(f=='attention')return r.score;return r[f]}
function cmp(a,op,b){return a==null?false:op=='>'?a>b:op=='>='?a>=b:op=='<'?a<b:op=='<='?a<=b:a==b}

// ------------------------------------------------------------------ semantic search: same model as scripts/embed/embed.mjs, query embedded locally
const SEM={idx:null,vec:null,ext:null,state:'idle',err:null,cache:new Map(),pending:new Set()};
// weights, tokenizer and config load at the index's pinned revision; transformers.js 4.2.0 still probes config.json and tokenizer_config.json at 'main' only to list which files exist
const TF_URL='https://cdn.jsdelivr.net/npm/@huggingface/transformers@4.2.0';
async function semLoad(){
 if(SEM.state=='ready'||SEM.state=='loading')return;SEM.state='loading';renderSemStatus();
 try{const [ix,bin]=await Promise.all([fetch('search-index.json').then(r=>{if(!r.ok)throw new Error('index HTTP '+r.status);return r.json()}),fetch('search-vectors.bin').then(r=>{if(!r.ok)throw new Error('vectors HTTP '+r.status);return r.arrayBuffer()})]);
  if(bin.byteLength!=ix.rows*ix.dim)throw new Error('vector size mismatch');
  if(!ix.revision)throw new Error('index has no pinned model revision');
  if(!SEM.ext||SEM.rev!==ix.revision){const tf=await import(TF_URL);SEM.ext=await tf.pipeline('feature-extraction',ix.model,{dtype:ix.dtype,revision:ix.revision});SEM.rev=ix.revision;SEM.cache.clear()}
  SEM.idx=ix;SEM.vec=new Int8Array(bin);SEM.pos={};for(const [t,v] of Object.entries(ix.tabs)){const m=new Map();v.ids.forEach((id,i)=>m.set(id,v.offset+i));SEM.pos[t]=m}
  SEM.state='ready'}
 catch(e){SEM.state='failed';SEM.err=e.message;console.warn('semantic search unavailable',e)}
 render()}
function semQuery(text){if(SEM.state!='ready'){semLoad();return null}if(SEM.cache.has(text))return SEM.cache.get(text);
 if(!SEM.pending.has(text)){SEM.pending.add(text);SEM.ext(text,{pooling:'mean',normalize:true}).then(t=>{SEM.cache.set(text,t.data);SEM.pending.delete(text);render()}).catch(e=>{SEM.pending.delete(text);console.warn(e)})}
 return null}
function semSim(tab,id,q){if(!SEM.idx||!SEM.pos)return null;const p=SEM.pos[tab]?.get(id);if(p==null)return null;const o=p*SEM.idx.dim,v=SEM.vec;let s=0;for(let k=0;k<SEM.idx.dim;k++)s+=q[k]*v[o+k];return s/SEM.idx.scale}
const semText=P=>P.terms.join(' ');
function renderSemStatus(){$('sem').classList.toggle('on',S.sem);$('sem').textContent=S.sem?(SEM.state=='loading'?'✦ loading…':SEM.state=='failed'?'✦ keyword':'✦ semantic'):'✦ off';
 $('sem').title=S.sem?(SEM.state=='failed'?'semantic model could not load ('+SEM.err+'); using keyword matching':'semantic search on: ranks by meaning with a small embedding model running in your browser (first query downloads a ~28 MB model from jsDelivr and Hugging Face, then cached; your query never leaves the browser). Click to switch to keyword matching'):'keyword matching. Click to rank by meaning instead'}

// ------------------------------------------------------------------ data access
function rowsFor(tab,win,view){
 if(tab=='hype'){if(!H||!H.windows[win]?.enabled)return {rows:[],candidates:0};const cur=H[win]?.[view]||{rows:[],candidates:0};
  return {candidates:cur.candidates,rows:cur.rows.map(r=>{const it=H.items[r.id],m=it.win[win]||{};return {...r,name:it.name,category:it.category,summary:it.summary,tag:it.tag,_disc:it.discovery.score,_dcov:it.discovery.coverage,mentions:m.mentions,voices:m.voices,platforms:m.platforms,first_seen:it.first_seen,days:since(it.first_seen)}})}}
 const cur=D[tab]?.[win]?.[view]||{rows:[],candidates:0};
 return {candidates:cur.candidates,rows:cur.rows.map(v=>({...D[tab].items[v.id],...v}))}}
function applyFilters(rows,P){
 let out=rows;
 if(S.mincov)out=out.filter(r=>(r.coverage??0)>=S.mincov&&(S.tab!='hype'||(r._dcov??0)>=S.mincov));

const slug=t=>t.toLowerCase().replace(/<[^>]+>/g,'').replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'');
function inl(t){return esc(t).replace(/`([^`]+)`/g,(m,c)=>'<code>'+c+'</code>').replace(/\*\*([^*]+)\*\*/g,'<b>$1</b>').replace(/(^|[\s(])\*([^*\s][^*]*?)\*(?=[\s).,;:]|$)/g,'$1<i>$2</i>')
 .replace(/\[([^\]]+)\]\(([^)\s]+)\)/g,(m,txt,u)=>{u=u.replace(/&amp;/g,'&');const h=u.startsWith('#')?'#methodology/'+u.slice(1):/^https?:/.test(u)?u:REPO+u;return `<a href="${esc(h)}"${h.startsWith('#')?'':' target=_blank rel=noopener'}>${txt}</a>`})}
function md2html(src){const L=src.replace(/\r/g,'').split('\n');let h='',i=0;const toc=[];const LI=/^\s*([-*]|\d+\.)\s+/;
 while(i<L.length){let l=L[i];
  if(/^```/.test(l)){let c=[];i++;while(i<L.length&&!/^```/.test(L[i]))c.push(L[i++]);i++;h+='<pre><code>'+esc(c.join('\n'))+'</code></pre>';continue}
  let m=l.match(/^(#{1,4})\s+(.*)/);if(m){const id=slug(m[2]);if(m[1].length==2)toc.push([id,m[2]]);h+=`<h${m[1].length} id="${id}">${inl(m[2])}</h${m[1].length}>`;i++;continue}
  if(/^\s*\|/.test(l)){let rows=[];while(i<L.length&&/^\s*\|/.test(L[i]))rows.push(L[i++]);const cells=r=>r.trim().replace(/^\||\|$/g,'').split('|').map(c=>c.trim());
   h+='<table><tr>'+cells(rows[0]).map(c=>'<th>'+inl(c)+'</th>').join('')+'</tr>'+rows.slice(2).map(r=>'<tr>'+cells(r).map(c=>'<td>'+inl(c)+'</td>').join('')+'</tr>').join('')+'</table>';continue}
  if(LI.test(l)){const ol=/^\s*\d+\./.test(l);let it=[];while(i<L.length&&(LI.test(L[i])||(/^\s{2,}\S/.test(L[i])&&it.length))){if(LI.test(L[i]))it.push(L[i].replace(LI,''));else it[it.length-1]+=' '+L[i].trim();i++}
   h+=(ol?'<ol>':'<ul>')+it.map(x=>'<li>'+inl(x)+'</li>').join('')+(ol?'</ol>':'</ul>');continue}
  if(/^>\s?/.test(l)){let q=[];while(i<L.length&&/^>\s?/.test(L[i]))q.push(L[i++].replace(/^>\s?/,''));h+='<blockquote>'+inl(q.join(' '))+'</blockquote>';continue}
  if(!l.trim()){i++;continue}
  let p=[];while(i<L.length&&L[i].trim()&&!/^(#{1,4}\s|```|\s*\||>)/.test(L[i])&&!LI.test(L[i]))p.push(L[i++]);h+='<p>'+inl(p.join(' '))+'</p>'}
 return {html:h,toc}}

async function loadHype(){try{const r=await fetch('hype.json?'+Date.now());if(!r.ok)throw new Error('HTTP '+r.status);H=await r.json()}catch(e){H=null;$('tb').innerHTML=`<tr><td class=empty>No HYPE data (hype.json): ${esc(e.message)}</td></tr>`;throw e}}
async function load(){const r=await fetch('data.json?'+Date.now());D=await r.json();HAY.clear();buildWho();if(SEM.idx&&SEM.idx.data_generated_at!==D.generated_at){SEM.idx=null;SEM.pos=null;SEM.vec=null;SEM.state='idle'}render()}
readHash();{const u=new URLSearchParams(location.search);if(u.get('q')){S.q=u.get('q');$('q').value=S.q}if(u.get('open'))S.sel=u.get('open').split(',')[0]}
load().catch(e=>{$('tb').innerHTML=`<tr><td class=empty>Could not load data.json: ${esc(e.message)}</td></tr>`});
setInterval(()=>{if(S.tab!='methodology'&&!document.hidden){H=S.tab=='hype'?H:null;load()}},5*60*1000);
</script>
