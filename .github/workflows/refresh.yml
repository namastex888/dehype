name: refresh
# Daily data refresh: fetch public sources, rescore, commit web/data.json to dev, then deploy.
# Pipeline state (history/trending.db snapshots and cache/) persists in the Actions cache; if it is
# ever evicted the next run starts a new history and the page says so (first run: everything new).
# HYPE is rebuilt only where the private research dossier exists, so web/hype.json is not touched here.
on:
  schedule:
    - cron: '17 9 * * *'   # 06:17 America/Sao_Paulo
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: refresh
  cancel-in-progress: false
jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: dev
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - name: Restore pipeline state
        uses: actions/cache/restore@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: |
            history
            cache
          key: pipeline-state-${{ github.run_id }}
          restore-keys: pipeline-state-
      - name: Fetch and score
        env:
          # A fine-grained read-only PAT raises GitHub limits (5,000/h); the job token (1,000/h) is the fallback.
          GH_TOKEN: ${{ secrets.TRENDING_GH_TOKEN || github.token }}
        run: python run.py
      - name: Save pipeline state
        if: always()
        uses: actions/cache/save@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: |
            history
            cache
          key: pipeline-state-${{ github.run_id }}
      - name: Back up history
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: history-${{ github.run_id }}
          path: history
          retention-days: 30
          if-no-files-found: ignore
      - name: Gate
        run: python -m unittest discover tests && node scripts/check_page.mjs
      - name: Commit snapshot
        run: |
          git config user.name "trend-observatory-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add web/data.json
          if git diff --cached --quiet; then echo "no data change"; exit 0; fi
          git commit -m "data: daily refresh $(date -u +%Y-%m-%d)"
          git push origin HEAD:dev
  deploy:
    needs: refresh
    uses: ./.github/workflows/deploy.yml
    secrets: inherit
