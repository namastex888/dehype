name: refresh
# Daily data refresh: fetch public sources, rescore, commit web/data.json to dev, then deploy.
# Pipeline state (history/trending.db snapshots and cache/) persists in the Actions cache; if it is
# ever evicted the next run starts a new history and the page says so (first run: everything new).
# The semantic index (web/search-*.{json,bin}) is rebuilt from the new data with a pinned local model.
# HYPE is rebuilt only where the private research dossier exists; here web/hype.json is only scrubbed (deletion-only): every post that
# web/removals.json (owner-reviewed) or web/checks/dossier-gone.json (written by pulse.py's deleted-post recheck) names leaves it.
# pulse.py rechecks by id, under a 180s time cap and fail-closed, every stored post its outputs could show (HN, Mastodon, Bluesky,
# Reddit) and every dossier HN post; a post found gone leaves the history DB, a post not reached shows as a count.
# Mastodon posts link to mastodon.social/statuses/<id> only after a logged-out render check passed (cached in
# web/checks/mastodon-links.json); the check is time-capped and fail-closed, so a failure leaves every unchecked post a count.
# The feeds (web/feed{,.pt}.{xml,json}) come from one Cordis step after pulse.py: @deepseek-ai/cordis pinned to 4.0.4 by its lockfile,
# installed with --ignore-scripts in a step with no secret and no id-token (this job has neither), time-capped; it opens no server or socket.
# Stale since (C5): when the Pulse step fails, the committed pulse.json and briefing.json are kept and web/checks/pulse-failed.json (never
# staged) tells compose.mjs to rewrite briefing.json and the feeds as "stale since" that briefing's date with the reason, carrying no value
# over; no manifest, ledger entry or Release is made that day.
# Ledger (design row 17; C3, C16, C32): scripts/manifest.py builds the day's input manifest (dist/, never committed; Reddit and Bluesky
# records only as SHA256 of their stored rows, no handle), writes web/ledger/<date>.json, its web/ledger/index.json entry and the story-id
# archive web/ledger/ids/<date>.json; the manifest goes on the dated Release ledger-<date> (a draft until the data commit is pushed, then
# published on that commit, never replaced, made with --latest=false; GitHub still badges a ledger Release Latest because no other full
# Release exists to take the badge) and, downloaded back, must hash to the ledger's manifest_sha256 before
# anything is committed. The Sigstore attestation of the manifest is made by the separate attest job (C42).
# OpenTimestamps (design row 18; C4, C38): scripts/ots.mjs, with opentimestamps pinned to 0.4.9 by scripts/checks/package-lock.json (LGPL-3.0,
# scripts/checks/NOTICE), stamps the day's manifest SHA256 into web/ledger/ots/<date>.ots before the Release step (no calendar answer: no
# ledger entry that day), committed pending; each later run upgrades every earlier proof no entry records anchored, commits the upgraded
# file in place, runs verify --ignore-bitcoin-node (block headers from https://blockstream.info/api) and records each accepted proof's
# date and Bitcoin block in its own entry only. `git add web/ledger` stages the proofs.
# Ready time (design row 20; C12, C34): scheduled at 04:45 America/Sao_Paulo (UTC-3, no daylight saving) so the day's briefing, gauges and
# feeds are live on Pages before 06:00; the cron is re-fitted after 7-10 scheduled runs and the deploy times are recorded in the wish.
# Push (C42, M2): the data commit is made and replayed onto dev in a step with no secret (dehype is a public repository, so the replay
# fetches over the public URL); PUSH_TOKEN is only in the next step, which runs git (hooks, credential helper, fsmonitor off), no npm,
# node or python. Not full isolation: github.token is still GH_TOKEN's fallback in "Fetch and score" and is held by the gh release steps,
# and an earlier step can write $GITHUB_ENV, $GITHUB_PATH or .git/config (include.path, url.*.insteadOf) that the push step inherits.
# The full fix (future work) is a separate push job on a fresh runner that receives the commit as a git bundle.
on:
  schedule:
    - cron: '45 7 * * *'   # 04:45 America/Sao_Paulo
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: refresh
  cancel-in-progress: false
jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    outputs:
      manifest: ${{ steps.handoff.outcome == 'success' && steps.ledger.outputs.asset || '' }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: dev
          persist-credentials: false   # no push credential on disk while third-party code runs
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - name: Restore pipeline state
        uses: actions/cache/restore@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: |
            history
            cache
          key: pipeline-state-${{ github.run_id }}
          restore-keys: pipeline-state-
      - name: Fetch and score
        env:
          # A fine-grained read-only PAT raises GitHub limits (5,000/h); the job token (1,000/h) is the fallback.
          GH_TOKEN: ${{ secrets.TRENDING_GH_TOKEN || github.token }}
        run: python run.py
      - name: Collect conversation for the Pulse topic map
        id: pulse
        # optional secrets enable Bluesky and the official Reddit API; arctic-shift, HN, Lobsters and Mastodon need none;
        # HF_TOKEN (a read token) only raises the Hub check's rate limit (hub.py runs without it)
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          BSKY_HANDLE: ${{ secrets.BSKY_HANDLE }}
          BSKY_APP_PASSWORD: ${{ secrets.BSKY_APP_PASSWORD }}
          REDDIT_CLIENT_ID: ${{ secrets.REDDIT_CLIENT_ID }}
          REDDIT_CLIENT_SECRET: ${{ secrets.REDDIT_CLIENT_SECRET }}
          REDDIT_USER_AGENT: ${{ secrets.REDDIT_USER_AGENT }}
        continue-on-error: true   # a Pulse failure must not block the data commit
        # after its lists and before any output write, pulse.py runs the deleted-post recheck and prints its checked, removed and
        # unreached counts and its time cap (180s); --relink below reuses that result (history/recheck.json) and makes no call
        run: python pulse.py
      - name: Keep the last briefing and mark this run stale (Pulse failed; compose.mjs writes "stale since" with the reason)
        if: steps.pulse.outcome == 'failure'
        run: |
          git restore --source=HEAD -- web/pulse.json web/briefing.json
          printf '{"at":"%s","run":"%s"}\n' "$(date -u +%Y-%m-%dT%H:%M:%SZ)" "$GITHUB_RUN_ID" > web/checks/pulse-failed.json
          echo "::warning::Pulse failed: the briefing, gauges and feeds read stale since the last briefing's date"
      - name: Save pipeline state
        if: success()
        uses: actions/cache/save@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: |
            history
            cache
          key: pipeline-state-${{ github.run_id }}
      - name: Back up history
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: history-${{ github.run_id }}
          path: history
          retention-days: 30
          if-no-files-found: ignore
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
      - name: Install the Mastodon render-check browser (playwright-core 1.59.1, lockfile, and the Chromium headless shell it pins)
        id: browser
        if: steps.pulse.outcome == 'success'
        continue-on-error: true   # no browser: no check, every Mastodon post without a fresh pass stays a count
        timeout-minutes: 3
        run: |
          npm ci --prefix scripts/checks --ignore-scripts --no-audit --no-fund
          node scripts/checks/node_modules/playwright-core/cli.js install --only-shell chromium
      - name: Mastodon render check (logged out, per post, time cap 180s)
        # prints candidates, due, pass, fail and not-reached counts and the time cap; writes web/checks/mastodon-links.json
        if: steps.browser.outcome == 'success'
        continue-on-error: true   # fail-closed: a post the check did not reach shows as a count
        timeout-minutes: 4
        run: node scripts/check_mastodon_links.mjs --candidates history/mastodon-candidates.json --cache web/checks/mastodon-links.json --cap-seconds 180
      - name: Rebuild Pulse with the checked Mastodon links
        id: relink
        if: steps.pulse.outcome == 'success'
        continue-on-error: true   # a relink failure must not block the data commit: the next step keeps the committed pair consistent
        run: python pulse.py --relink
      - name: Keep pulse.json and the check cache consistent after a failed relink
        # the first pulse.json was built from the checked-out cache, so it is committed with that cache, not the new one
        if: steps.relink.outcome == 'failure'
        run: git restore --source=HEAD -- web/checks/mastodon-links.json && echo "::warning::relink failed; Mastodon check cache restored from HEAD"
      - name: Drop removed and deleted dossier posts from hype.json (removals.json, checks/dossier-gone.json; deletion-only)
        # runs whatever Pulse did: an owner-accepted removal applies even on a day the recheck failed; idempotent, a no-op without a listed post
        run: python hype_build.py --scrub web/hype.json
      - name: Compose the feeds and page tables (one-shot Cordis 4.0.4 from its lockfile; no secret in this step; time cap 2 min)
        # node scripts/dehype/compose.mjs: a Cordis context loads the feed and frontend plugins, which write web/feed.xml, web/feed.json,
        # web/feed.pt.xml, web/feed.pt.json and web/i18n/table.{en,pt}.json from the day's briefing.json, pulse.json, verdicts.json,
        # story-aliases.json and i18n/strings.json, then disposes. A failure fails the run, so feeds out of step with briefing.json are never committed.
        timeout-minutes: 2
        run: |
          start=$SECONDS
          npm ci --prefix scripts/dehype --ignore-scripts --no-audit --no-fund
          npm ls @deepseek-ai/cordis --prefix scripts/dehype | grep -q '@deepseek-ai/cordis@4.0.4'
          node scripts/dehype/compose.mjs
          echo "cordis step: $((SECONDS - start))s (npm ci and compose) of its 120s time cap"
      - name: Build semantic search index
        run: npm ci --prefix scripts/embed --ignore-scripts --no-audit --no-fund && node scripts/embed/embed.mjs web
      - name: Input manifest, ledger and story-id archive (scripts/manifest.py; the manifest check runs before anything is written)
        id: ledger
        if: steps.pulse.outcome == 'success'
        continue-on-error: true   # no manifest or a refused entry: the day's ledger files are dropped below, the briefing is still committed
        run: python scripts/manifest.py daily --web web --history history --out dist/manifest
      - name: OpenTimestamps proof of the day's manifest (opentimestamps 0.4.9 from the lockfile; committed pending)
        # sends only the manifest SHA256 to the client's public calendars; a same-date rerun keeps a proof of the same manifest
        id: stamp
        if: steps.ledger.outcome == 'success'
        continue-on-error: true   # no calendar answered: no proof, so the day's ledger entry is dropped below (no Release either)
        timeout-minutes: 2       # each calendar has a 45 s deadline in scripts/ots.mjs
        env:
          DATE: ${{ steps.ledger.outputs.date }}
        run: |
          # the tree is installed by the render-check browser step above (npm ci, same lockfile); no tree or another pin: no proof
          npm ls opentimestamps --prefix scripts/checks | grep -q 'opentimestamps@0.4.9'
          node scripts/ots.mjs stamp --web web --date "$DATE"
      - name: Put the manifest on its dated draft Release and read it back (its SHA256 must equal the ledger's)
        # a draft until the data commit is pushed (published after the push); a published asset is never replaced: one already there must be
        # byte-identical, else this step fails and the day's entry is dropped
        id: release
        if: steps.stamp.outcome == 'success'
        continue-on-error: true   # no Release: the day's ledger files are dropped below, the briefing is still committed
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ledger-${{ steps.ledger.outputs.date }}
          ASSET: ${{ steps.ledger.outputs.path }}
          NAME: ${{ steps.ledger.outputs.asset }}
        run: |
          if ! draft=$(gh release view "$TAG" --json isDraft --jq .isDraft 2>/dev/null); then
            gh release create "$TAG" --draft --latest=false --title "dehype ledger $TAG" \
              --notes "Daily input manifest for ${TAG#ledger-} (scripts/manifest.py); its SHA256 is in web/ledger/index.json."
            draft=true
          fi
          rm -rf dist/release && mkdir -p dist/release
          if gh release download "$TAG" --pattern "$NAME" --dir dist/release 2>/dev/null; then
            if ! cmp -s "dist/release/$NAME" "$ASSET"; then
              if [ "$draft" != true ]; then echo "::error::$TAG is published with a different $NAME; it is never replaced"; exit 1; fi
              gh release delete-asset "$TAG" "$NAME" --yes                 # a draft left by a run whose commit never landed
              gh release upload "$TAG" "$ASSET"
            fi
          else
            gh release upload "$TAG" "$ASSET"
          fi
          rm -rf dist/release && gh release download "$TAG" --pattern "$NAME" --dir dist/release
          python scripts/manifest.py release "dist/release/$NAME" --tag "$TAG" --web web \
            --url "https://github.com/${GITHUB_REPOSITORY}/releases/download/$TAG/$NAME"
      - name: Drop the day's ledger entry when the manifest step, the proof or the Release failed (the story-id archive stays)
        # the ledger never names a Release it does not equal, nor a day without its proof; web/ledger/ids/ is committed whatever happened here
        if: steps.ledger.outcome == 'failure' || steps.stamp.outcome == 'failure' || steps.release.outcome == 'failure'
        env:
          DATE: ${{ steps.ledger.outputs.date }}
        run: |
          git restore --source=HEAD -- web/ledger/index.json 2>/dev/null || echo '[]' > web/ledger/index.json
          for f in web/ledger/*.json; do
            [ "$f" = web/ledger/index.json ] && continue
            git restore --source=HEAD -- "$f" 2>/dev/null || rm -f "$f"
          done
          if [ -n "$DATE" ]; then git restore --source=HEAD -- "web/ledger/ots/$DATE.ots" 2>/dev/null || rm -f "web/ledger/ots/$DATE.ots"; fi
          echo "::warning::no ledger entry today (manifest step: ${{ steps.ledger.outcome }}, proof: ${{ steps.stamp.outcome }}, Release: ${{ steps.release.outcome }})"
      - name: OpenTimestamps upgrade and verify
        # upgrade every earlier proof no ledger entry records anchored (in place), verify --ignore-bitcoin-node against the public Esplora
        # explorer at https://blockstream.info/api (its block assumed valid), and record each accepted proof's date and Bitcoin block in
        # today's entry only; then the client's own CLI re-checks each one recorded today. Calendars or explorer down: still pending.
        if: steps.release.outcome == 'success'
        continue-on-error: true   # a proof not yet upgraded reads "pending", which passes (C4); a failure here never blocks the data commit
        timeout-minutes: 3       # the loop stops at its 150 s budget (45 s deadline per call) and keeps what it recorded
        env:
          DATE: ${{ steps.ledger.outputs.date }}
        run: |
          node scripts/ots.mjs upgrade --web web --date "$DATE" --budget 150
          jq -r --arg d "$DATE" '(map({(.date): .manifest_sha256}) | add) as $M | .[] | select(.date == $d) | .anchored[]? | "\(.date) \(.block) \($M[.date])"' web/ledger/index.json |
          while read -r day block digest; do
            if timeout 20 node scripts/checks/node_modules/opentimestamps/ots-cli.js verify --ignore-bitcoin-node -t 15000 -d "$digest" "web/ledger/ots/$day.ots" | tee /dev/stderr | grep -q "Success! Bitcoin block $block "; then
              echo "ots $day: verify --ignore-bitcoin-node accepts block $block"
            else
              echo "::warning::ots $day: the client CLI did not confirm block $block (explorer unreachable?); the record stays, re-check it by hand"
            fi
          done
      - name: Hand the manifest to the attest job
        id: handoff
        if: steps.release.outcome == 'success'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: manifest-${{ github.run_id }}
          path: ${{ steps.ledger.outputs.path }}
          retention-days: 7
          if-no-files-found: error
      - name: Gate
        run: python -m unittest discover tests && node scripts/check_page.mjs
      - name: Commit snapshot and replay it onto dev (no secret in this step)
        id: snapshot
        run: |
          git config user.name "trend-observatory-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add web/data.json web/search-index.json web/search-vectors.bin web/pulse.json web/briefing.json web/checks/mastodon-links.json web/story-aliases.json web/hype.json web/checks/dossier-gone.json web/feed.xml web/feed.json web/feed.pt.xml web/feed.pt.json web/ledger
          if git diff --cached --quiet; then echo "no data change"; exit 0; fi
          git commit -m "data: daily refresh $(date -u +%Y-%m-%d)"
          # dev may have moved during the run: replay the data commit on top (fresh data wins) over the public URL, then recompose the
          # feeds on the replayed tree (verdicts.json or strings.json may have changed on dev) and recheck them and the owner files
          git pull --rebase -X theirs "https://github.com/${GITHUB_REPOSITORY}.git" dev
          node scripts/dehype/compose.mjs
          git add web/feed.xml web/feed.json web/feed.pt.xml web/feed.pt.json
          if ! git diff --cached --quiet; then git commit --amend --no-edit; echo "feeds recomposed after the replay"; fi
          python -m unittest tests.test_feed
          # this push uses github.token, so it triggers no ci.yml run: the bot checks its own commit before pushing (no push on a failure)
          python scripts/check_owner_files.py HEAD~1
          echo "commit=1" >> "$GITHUB_OUTPUT"
      - name: Push the data commit to dev (the token is in this step only; it runs git alone, with no hook, credential helper or fsmonitor)
        if: steps.snapshot.outputs.commit == '1'
        env:
          PUSH_TOKEN: ${{ github.token }}
        run: |
          g() { git -c core.hooksPath=/dev/null -c credential.helper= -c core.fsmonitor=false "$@"; }
          remote="https://x-access-token:${PUSH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          for i in 1 2 3; do
            base=$(g rev-parse HEAD~1)
            g push "$remote" HEAD:dev && exit 0
            g pull --rebase -X theirs "https://github.com/${GITHUB_REPOSITORY}.git" dev || { g rebase --abort 2>/dev/null || true; }
            # the feeds were composed on $base: replay them only when nothing compose.mjs reads moved on dev since then
            if g diff --name-only "$base" HEAD~1 -- web/verdicts.json web/story-aliases.json web/i18n scripts/dehype | grep -q .; then
              echo "::error::the feed inputs changed on dev after the replay; re-run the refresh"; exit 1
            fi
            sleep $((i * 10))
          done
          echo "::error::could not push the data commit to dev"; exit 1
      - name: Publish the dated Release on the pushed data commit (not marked latest)
        if: steps.release.outcome == 'success'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ledger-${{ steps.ledger.outputs.date }}
        run: |
          if [ "$(gh release view "$TAG" --json isDraft --jq .isDraft)" = true ]; then
            gh release edit "$TAG" --draft=false --latest=false --target "$(git rev-parse HEAD)"
          fi
          echo "$TAG published on $(git rev-parse HEAD)"
  deploy:
    needs: refresh
    permissions:
      contents: read
      pages: write
      id-token: write
    uses: ./.github/workflows/deploy.yml
  attest:
    # Sigstore attestation of the day's manifest (design row 18, C4, C42), in its own job: no checkout, no npm or pip code, and a token
    # that can only mint the OIDC identity and write the attestation. Check it with `gh attestation verify <manifest> --repo <owner/repo>`.
    needs: refresh
    if: needs.refresh.outputs.manifest != ''
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      id-token: write
      attestations: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: manifest-${{ github.run_id }}
          path: manifest
      - uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be # v2.4.0
        with:
          subject-path: manifest/${{ needs.refresh.outputs.manifest }}
  verify-attestation:
    # The per-deploy check `gh attestation verify` on the day's manifest (C39), with a read-only token and no id-token.
    needs: [refresh, attest]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      attestations: read
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: manifest-${{ github.run_id }}
          path: manifest
      - name: gh attestation verify on the day's manifest
        env:
          GH_TOKEN: ${{ github.token }}
          ASSET: manifest/${{ needs.refresh.outputs.manifest }}
        run: gh attestation verify "$ASSET" --repo "$GITHUB_REPOSITORY" --signer-workflow "$GITHUB_REPOSITORY/.github/workflows/refresh.yml"
