name: ci
# Offline gate: unit tests (leak fixtures included), fixture evaluation, scoring smoke, and the page and public-data check. No network collection.
on:
  pull_request:
  push:
    branches: [dev]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
          fetch-depth: 0               # the owner-file check reads the base commit
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - name: Cordis composition pin (@deepseek-ai/cordis 4.0.4 from the lockfile, install scripts off; tests/test_feed.py runs compose.mjs)
        run: |
          npm ci --prefix scripts/dehype --ignore-scripts --no-audit --no-fund
          npm ls @deepseek-ai/cordis --prefix scripts/dehype | grep -q '@deepseek-ai/cordis@4.0.4'
      - name: Checks tree pins (playwright-core 1.59.1, opentimestamps 0.4.9 from the lockfile; no browser download; tests/test_ots.py runs the client offline)
        run: |
          npm ci --prefix scripts/checks --ignore-scripts --no-audit --no-fund
          npm ls playwright-core --prefix scripts/checks | grep -q 'playwright-core@1.59.1'
          npm ls opentimestamps --prefix scripts/checks | grep -q 'opentimestamps@0.4.9'
      - name: Tests and fixture evaluation
        run: python -m unittest discover tests && python eval.py --features tests/fixtures/features_a.json tests/fixtures/features_b.json --hype tests/fixtures/hype_small.json
      - name: Stale since in the browser (dehype.js staleSince, the six SC-19 cases; Decision 15)
        run: node --test tests/dehype_stale.test.mjs
      - name: Scoring smoke
        run: python eval.py --issue11-smoke --features tests/fixtures/features_a.json tests/fixtures/features_b.json --hype tests/fixtures/hype_small.json --compare-v2
      - name: Owner-reviewed files (corrections appended, never edited over, against the base commit; no bot commit touches verdicts or corrections)
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: python scripts/check_owner_files.py "$BASE"
      - name: Page data, script and public-data check (handles, Reddit, X/LinkedIn/YouTube/Telegram, X figures, Mastodon links, verdict rows)
        run: node scripts/check_page.mjs
  search-index:
    # Proves the semantic index builds on a clean Linux runner (same step refresh.yml and deploy.yml run).
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
      - name: Build index into a scratch copy and check it
        run: |
          cp -R web "$RUNNER_TEMP/"                  # the whole tree: the gate also reads web/i18n/
          npm ci --prefix scripts/embed --ignore-scripts --no-audit --no-fund
          node scripts/embed/embed.mjs "$RUNNER_TEMP/web"
          node scripts/check_page.mjs "$RUNNER_TEMP/web"
