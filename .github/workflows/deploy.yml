name: deploy
# Publishes web/ to GitHub Pages, the only host (design row 21). Runs on pushes to dev that touch the site, on demand,
# and as the last job of the daily refresh (pushes made with GITHUB_TOKEN do not trigger workflows).
on:
  push:
    branches: [dev]
    paths: ['web/**', 'METHODOLOGY.md', 'METHODOLOGY.pt.md', '.github/workflows/deploy.yml']
  workflow_dispatch:
  workflow_call:
permissions:
  contents: read
concurrency:
  group: deploy
  cancel-in-progress: false
jobs:
  github-pages:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: dev
          persist-credentials: false
          fetch-depth: 0               # the owner-file check reads the push's before commit
      - name: Owner-reviewed files (no edited or removed corrections entry, no bot commit on verdicts or corrections, before publishing)
        env:
          BASE: ${{ github.event.before }}
        run: python3 scripts/check_owner_files.py "$BASE"
      - name: Sync methodology and check the page
        run: |
          cp METHODOLOGY.md web/METHODOLOGY.md
          cp METHODOLOGY.pt.md web/METHODOLOGY.pt.md
          node scripts/check_page.mjs
      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3.0.1
        with:
          path: web
      - id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4.0.5
